name: Discogs sync

on:
  schedule:
    - cron: '13 3 * * *'
  
  workflow_dispatch: # zodat je hem ook met de hand kunt starten

permissions:
  contents: write # nodig om het resultaat terug te committen

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Discogs ophalen
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          DISCOGS_USER: ${{ vars.DISCOGS_USER }}
        run: node scripts/discogs-sync.mjs

      - name: Committen als er iets veranderd is
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discogs.json
          if git diff --staged --quiet; then
            echo "Geen wijzigingen."
          else
            git commit -m "Discogs-sync $(date -u +%Y-%m-%d)"
            git push
          fi
